# Configuration for baberu
working_dir: ""

logging:
  log_to_file: true
  console_level: "INFO"
  file_level: "DEBUG"

transcription:
  elevenlabs_model: "whisper-1"
  default_lang_from: "ja"
  # Request parameters sent to the service as they are, over baberu's defaults.
  # For ElevenLabs, e.g. num_speakers, no_verbatim, keyterms, numbers_format, temperature, seed.
  options: {}
  retranscribe_model: ""                           # empty: the same model as above
  retranscribe_options:                            # empty: the same options as above
  retranscribe_kinds: ["smear", "collapse", "loop"] # anomalies sent to be transcribed again (paid)

parsing:
  delimiters: ["。","？","！","-","?","!","」","「"]
  soft_delimiters: ["、"," ","　"]
  remove_text: ["」","「"]
  soft_max_chars: 20
  hard_max_chars: 50
  hard_max_carryover: 15
  max_time_gap_sec: 2.0
  fragment_max_letters: 2         # a tail this short, cut off by a pause mid-word (乾…杯), rejoins its line
  fragment_max_gap_sec: 5.0       # ...unless the pause is longer than this
  parsing_model: "gpt-4.1-mini"
  parsing_effort:        # how hard the line splitter thinks (low, medium, high); empty: the provider's default

mistimed_lines:
  mistimed_line_thresh_sec: 0.1
  method: "backfill"     # backfill: short lines take the time before them
                         # squeezed: only short lines pressed against the next line start earlier (for Scribe v3)
  squeezed_letters_per_sec: 8.0
  squeezed_min_sec: 0.3
  squeezed_max_sec: 1.0
  squeezed_touch_sec: 0.1

subtitle_padding:
  max_lead_out_sec: 2.0
  max_lead_in_sec: 0.25
  max_cps: 15.0
  min_sec: 1.0

mistimed_segs:
  mistimed_seg_thresh_sec: 0.1
  seg_min_lines: 4
  seg_backtrace_limit: 20
  seg_foretrace_limit: 5
  seg_min_delay: 10.0
  seg_max_gap: 4
  clip_margin_sec: 1.0   # second-pass clips are cut this much wider for lead-in; words in the margin are dropped

# Transcript problems reported by --diagnose and health.json. A token must break the
# physical limit and also be median_multiple times away from the file's median.
anomalies:
  smear_sec_per_letter: 2.5      # held longer than this per letter...
  smear_min_sec: 3.0             # ...and at least this long
  collapse_sec_per_letter: 0.02  # squeezed shorter than this per letter...
  collapse_min_tokens: 4         # ...for at least this many words in a row
  max_letters_per_sec: 25.0      # spreading out a collapse may not be faster than this
  median_multiple: 10.0
  loop_min_repeats: 5
  loop_max_tokens: 6
  low_confidence_logprob: -1.5   # only used when the model's logprob varies
  low_confidence_min_tokens: 3
  disorder_tolerance_sec: 0.05

# Settings for one transcription model or source language, laid over everything above.
# `model` matches part of transcription.model; `lang` matches the source language.
# A profile may change transcription, parsing, mistimed_lines, mistimed_segs and anomalies.
# Matching profiles apply in order. Listing profiles here replaces the built-in one below.
profiles:
  - model: "scribe_v1"
    settings:
      transcription:
        options: {diarization_threshold: 0.1}
  # - model: "scribe_v3"
  #   settings:
  #     mistimed_lines: {method: "squeezed"}   # v3 starts are right except for squeezed reactions

translation:
  default_model: "gemini-2.5-pro"
  websearch_model: "gemini-2.5-pro"
  fallback_model: "o3"
  effort:                # how hard the translation and notes models think; empty: the provider's default
  default_lang_to: "en"
  context_lines: 100
  batch_lines: 50
  discard_lines: 10
  translate_retries: 3
  server_retries: 20
  max_cont_lines: 5
  confirm_auto_context: true

# Names and jargon sent to the transcription service (ElevenLabs Scribe) so they are
# spelled right. Scribe charges 20% more when keyterms are sent.
keyterms:
  enabled: true
  lists_dir: ""          # empty: a keyterms folder beside this config; one term per line in <name>.txt
  channels: {}           # YouTube channel_id: [list names] used for every video from that channel
  llm_model: ""          # a model that picks names out of the video's title and description; empty: tags and lists only
  effort: "low"
  max_terms: 100         # above 100, Scribe bills every request (each retranscribed clip) for at least 20 s
  confirm: true          # show the list and wait, so keyterms.txt can be edited before transcribing
  retranscribe: true     # send them on the second pass too
